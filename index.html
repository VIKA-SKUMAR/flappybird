<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#70c5ce;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
overflow:hidden;
}

canvas{
background:linear-gradient(#70c5ce,#ffffff);
border:4px solid #333;
border-radius:10px;
}

#score{
position:absolute;
top:20px;
font-size:35px;
font-weight:bold;
color:#fff;
text-shadow:2px 2px 5px #000;
}

#gameOver{
position:absolute;
display:none;
text-align:center;
color:white;
font-size:35px;
font-weight:bold;
text-shadow:2px 2px 5px black;
}
</style>

</head>

<body>

<div id="score">0</div>

<div id="gameOver">
GAME OVER
<br><br>
<button onclick="location.reload()">Play Again</button>
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreText=document.getElementById("score");
const over=document.getElementById("gameOver");

let bird={
x:80,
y:250,
size:20,
gravity:0.6,
lift:-10,
velocity:0
};

let pipes=[];
let score=0;
  function createPipe() {
  const gap = 170;
  const topHeight = Math.floor(Math.random() * 250) + 50;

  pipes.push({
    x: canvas.width,
    width: 70,
    top: topHeight,
    bottom: topHeight + gap,
    passed: false
  });
}

setInterval(createPipe, 1800);

function drawBird() {
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
  ctx.fillStyle = "yellow";
  ctx.fill();
  ctx.closePath();

  ctx.fillStyle = "orange";
  ctx.fillRect(bird.x + 12, bird.y - 3, 10, 6);

  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(bird.x + 5, bird.y - 6, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipes() {

  for (let i = 0; i < pipes.length; i++) {

    let p = pipes[i];

    p.x -= 3;

    ctx.fillStyle = "green";

    ctx.fillRect(p.x, 0, p.width, p.top);

    ctx.fillRect(
      p.x,
      p.bottom,
      p.width,
      canvas.height - p.bottom
    );

    if (
      bird.x + bird.size > p.x &&
      bird.x - bird.size < p.x + p.width &&
      (bird.y - bird.size < p.top ||
       bird.y + bird.size > p.bottom)
    ) {
      over.style.display = "block";
      cancelAnimationFrame(animationId);
      return;
    }

    if (!p.passed && p.x + p.width < bird.x) {
      p.passed = true;
      score++;
      scoreText.innerHTML = score;
    }
  }
}let animationId;

function update() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  drawBird();
  drawPipes();

  if (bird.y + bird.size >= canvas.height ||
      bird.y - bird.size <= 0) {

    over.style.display = "block";
    cancelAnimationFrame(animationId);
    return;
  }

  animationId = requestAnimationFrame(update);
}

function jump() {
  bird.velocity = bird.lift;
}

document.addEventListener("keydown", function(e) {
  if (e.code === "Space") {
    jump();
  }
});

document.addEventListener("touchstart", function() {
  jump();
});

createPipe();
update();
